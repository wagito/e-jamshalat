<!DOCTYPE html><script>submitted=false;url='https:\/\/script.google.com/macros/s/AKfycbzgOVw90bNqAp_SZHHFngn0aSfutF3fLh9klDmSrrg0jFMPCw3YXYjvu4LlxGlFeQDa/exec';</script><html><head><title>seting e-jamshalat</title><link rel="icon" href="./favicon.ico"><link rel=stylesheet href='https:\/\/maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css'><script src='https:\/\/ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script><script src='https:\/\/maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js'></script><style>table{width:100%;border:1px solid blue;border-collapse:separate;border-spacing:10px}</style></head><body><iframe name=_iframe style='display:none' onload="if(submitted){window.location='seting.html';}"></iframe><div class=container><h2 id=judul>Seting e-jamshalat</h2><form name=fdata method=POST onsubmit='save()' target=_iframe><div id=divuser style='display:block'><input type=hidden name=id><br><label>no Hp:</label><input type=text name=hp class='form-control'><label>password:</label><input type=password name=password class='form-control' onfocus="type='text'" onblur="type='password'"></div><div id=divdata style='display:none'><label>nama:</label><input type=text name=nama class='form-control'><label>alamat:</label><input type=text name=alamat class='form-control'><label>kota:</label><input type=text name=kota class='form-control'><label>latitude:</label><input type=text name=latitude class='form-control'><label>longitude:</label><input type=text name=longitude class='form-control'><label>zona waktu:</label><select id=timezone name=timezone class='form-control'><option value=''>--Zona Waktu--</option></select><label>metode:</label><select id=method name=method class='form-control'><option value=''>--Metode--</option></select><br><label>jeda adzan-iqamah(menit):</label><table><tr><th>Fajar</th><th>Duhur</th><th>Ashar</th><th>Maghr</th><th>Isya</th><tr><td><input type=text name=iqm0 class='form-control'></td><td><input type=text name=iqm1 class='form-control'></td><td><input type=text name=iqm2 class='form-control'></td><td><input type=text name=iqm3 class='form-control'></td><td><input type=text name=iqm4 class='form-control'></td></table><br><label>koreksi waktu(menit):</label><table><tr><th>Fajar</th><th>Duha</th><th>Duhur</th><th>Ashar</th><th>Maghr</th><th>Isya</th><tr><td><input type=text name=mnt0 class='form-control'></td><td><input type=text name=mnt1 class='form-control'></td><td><input type=text name=mnt2 class='form-control'></td><td><input type=text name=mnt3 class='form-control'></td><td><input type=text name=mnt4 class='form-control'></td><td><input type=text name=mnt5 class='form-control'></td></table></div><br><table style='border:0;width:30%'><tr><td><input type=button value=check class='btn btn-info' onclick=check()></td><td><input type=submit id=idsubmit value=submit class='btn btn-success' style='display:none'></td><td><input type=button value=clear class='btn btn-warning' onclick=myclear()></td></table></form></div></body></html><script>timeZone={'-12':'AoE(Anywhere on Earth)','-11':'SST(Samoa Standard Time)','-10':'HST(Hawaii-Aleutian Standard Time)','-9.5':'MIT(Marquesas Islands Time)','-9':'AKST(Alaska Standard Time)','-8':'PST(Pacific Standard Time)','-7':'MST(Mountain Standard Time)','-6':'CST(Central Standard Time)','-5':'EST(Eastern Standard Time)','-4':'AST(Atlantic Standard Time)','-3.5':'NST(Newfoundland Standard Time)','-3':'ART(Argentina Time)/BRT','-2':'FNT(Fernando de Noronha Time)','-1':'AZOT(Azores Standard Time)','0':'GMT(Greenwich Mean Time)/WET','1':'CET(Central European Time)/WAT','2':'EET(Eastern European Time)/CAT','3':'MSK(Moscow Time)/EAT','3.5':'IRST(Iran Standard Time)','4':'GST(Gulf Standard Time)','4.5':'AFT(Afghanistan Time)','5':'PKT(Pakistan Standard Time)','5.5':'IST(Indian Standard Time)','5.75':'NPT(Nepal Time)','6':'BST(Bangladesh Standard Time)','6.5':'MMT(Myanmar Time)','7':'WIB(Waktu Indonesia Barat)/ICT','8':'WITA(Waktu Indonesia Tengah)/CST','9':'WIT(Waktu Indonesia Timur)/JST','9.5':'ACST(Australian Central Standard Time)','10':'AEST(Australian Eastern Standard Time)','10.5':'LHST(Lord Howe Standard Time)','11':'SBT(Solomon Islands Time)','12':'NZST(New Zealand Standard Time)','12.75':'CHAST(Chatham Standard Time)','13':'TOT(Tonga Time)','14':'LINT(Line Islands Time)'};method={MWL:'Muslim World League',ISNA:'Islamic Society of North America(ISNA)',Egypt:'Egyptian General Authority of Survey',Makkah:'Umm Al-Qura University,Makkah',Karachi:'University of Islamic Sciences,Karachi',Tehran:'Institute of Geophysics,University of Tehran',Jafari:'Shia Ithna-Ashari,Leva Institute,Qum',Kemenag:'Kemenag,Indonesia',Muhammadiyah:'Muhammadiyah,Indonesia'};selectTimeZone=document.getElementById('timezone');Object.keys(timeZone).forEach(key=>{opsi=document.createElement('option');opsi.value=key;opsi.textContent=timeZone[key];selectTimeZone.appendChild(opsi);});selectMethod=document.getElementById('method');Object.keys(method).forEach(key=>{opsi=document.createElement('option');opsi.value=key;opsi.textContent=method[key];selectMethod.appendChild(opsi);});function myclear(){localStorage.clear();fdata.reset();fdata.hp.readOnly=false;divdata.style.display='none';idsubmit.style.display='none';}function save(){submitted=true;formData=new FormData(fdata);d=Array.from(formData.values()).slice(0,10);d[10]=d[11]='';for(i=0;i<=4;i++){d[10]+=formData.get(`iqm${i}`)+';'}for(i=0;i<=5;i++){d[11]+=formData.get(`mnt${i}`)+';'}localStorage.setItem('data',JSON.stringify(d));}function check(){hp=fdata.hp.value;pass=fdata.password.value;if(hp==''||pass=='')return;fetch(url+'?m='+hp+'&p='+pass).then(response=>response.json()).then(datajs=>{if(datajs!=''){localStorage.setItem('data',JSON.stringify(datajs[0]));main();}else {judul.innerHTML='<font color=red>Data kosong</font>';}}).catch(error=>{judul.innerHTML='<font color=red>internet error</font>';});}function main(){data=JSON.parse(localStorage.getItem('data'));fdata.hp.readOnly=true;divdata.style.display='block';idsubmit.style.display='block';fe=fdata.elements;for(i=0;i<=9;i++)fe[i]&&(fe[i].value=data[i]);iqm=data[10].split(";");for(i=10;i<=14;i++)fe[i]&&(fe[i].value=iqm[i-10]);mnt=data[11].split(";");for(i=15;i<=20;i++)fe[i]&&(fe[i].value=mnt[i-15]);}fdata.action=url;if(localStorage.getItem('data'))main();</script>
